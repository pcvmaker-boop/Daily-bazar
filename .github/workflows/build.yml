name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          test -f DailyBazar.html
          P=android
          mkdir -p $P/app/src/main/assets $P/app/src/main/java/com/dailybazar/app $P/app/src/main/res/values $P/app/src/main/res/drawable $P/app/src/main/res/mipmap-anydpi-v26
          cp DailyBazar.html $P/app/src/main/assets/index.html
          cat > $P/settings.gradle <<'X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DailyBazar"
          include ':app'
          X
          cat > $P/build.gradle <<'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X
          echo "android.useAndroidX=true" > $P/gradle.properties
          cat > $P/app/build.gradle <<'X'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dailybazar.app'
              compileSdk 34
              defaultConfig { applicationId "com.dailybazar.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          X
          cat > $P/app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:label="Daily Bazar" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          X
          cat > $P/app/src/main/java/com/dailybazar/app/MainActivity.java <<'X'
          package com.dailybazar.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0F4D30"));
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, u));
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          X
          cat > $P/app/src/main/res/values/styles.xml <<'X'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#F5F8F4</item>
              </style>
          </resources>
          X
          cat > $P/app/src/main/res/drawable/ic_bg.xml <<'X'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1B7A4B" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          X
          cat > $P/app/src/main/res/drawable/ic_fg.xml <<'X'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="48" android:viewportHeight="48">
              <group android:scaleX="0.62" android:scaleY="0.62" android:pivotX="24" android:pivotY="24">
                  <path android:fillColor="#F5A91C" android:pathData="M10,21h28l-3,17a3,3 0,0 1,-3 2.5H16a3,3 0,0 1,-3 -2.5z"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M24,14c0,-5 5,-7 9,-6 -1,5 -4,7 -9,6z"/>
              </group>
          </vector>
          X
          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          X
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DailyBazar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
